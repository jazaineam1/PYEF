name: causal-wargame-publish

on:
  push:
    branches: [main]
    paths:
      - 'causal-wargame/**'
      - '.github/workflows/causal-wargame-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: causal-wargame
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Build secure
        working-directory: causal-wargame
        run: npm run build:secure
      - name: Stage isolated Pages app
        run: |
          rm -rf dos-futuros
          mkdir -p dos-futuros
          cp -R causal-wargame/dist/. dos-futuros/
          printf 'DOS FUTUROS secure build\n' > dos-futuros/BUILD.txt
      - name: Commit generated HTML/JS/CSS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dos-futuros
          if git diff --cached --quiet; then
            echo 'No build changes'
          else
            git commit -m 'deploy: publish DOS FUTUROS secure build [skip ci]'
            git push
          fi
