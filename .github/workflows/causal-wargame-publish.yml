name: causal-wargame-publish

on:
  push:
    branches: [main]
    paths:
      - 'causal-wargame/**'
      - '.github/workflows/causal-wargame-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: causal-wargame
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Build secure
        working-directory: causal-wargame
        run: npm run build:secure
      - name: Stage isolated Pages app
        run: |
          rm -rf dos-futuros
          mkdir -p dos-futuros
          cp -R causal-wargame/dist/. dos-futuros/
          printf 'DOS FUTUROS secure build\n' > dos-futuros/BUILD.txt
      - name: Commit generated HTML/JS/CSS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dos-futuros
          if git diff --cached --quiet; then
            echo 'No build changes'
          else
            git commit -m 'deploy: publish DOS FUTUROS secure build [skip ci]'
            git push
          fi
      - name: Verify public Pages and Supabase health
        run: |
          pages=(
            'https://jazaineam1.github.io/PYEF/dos-futuros/'
            'https://jazaineam1.github.io/PYEF/dos-futuros/play.html'
            'https://jazaineam1.github.io/PYEF/dos-futuros/facilitator.html'
            'https://jazaineam1.github.io/PYEF/dos-futuros/wall.html'
            'https://jazaineam1.github.io/PYEF/dos-futuros/system-check.html'
          )
          for url in "${pages[@]}"; do
            echo "Checking $url"
            curl --retry 18 --retry-delay 5 --retry-all-errors --max-time 15 -fsS "$url" >/dev/null
          done
          curl --retry 6 --retry-delay 3 --retry-all-errors --max-time 10 -fsS 'https://nedsrnqwvxtelddmtvtv.supabase.co/functions/v1/health' | grep -q '"ok":true'
