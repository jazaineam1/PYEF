name: dean-cup-canonical-econml-training
on:
  push:
    branches: [main]
    paths:
      - 'causal-wargame/scripts/precompute_econml_dean.py'
      - '.github/workflows/dean-cup-canonical-econml.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dean-cup-econml-canonical
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real EconML (not Pyodide)
        run: python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'scikit-learn==1.5.2' 'econml==0.16.0'
      - name: Train canonical Copa synthetic models
        run: python causal-wargame/scripts/precompute_econml_dean.py
      - name: Validate study provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('causal-wargame/src/v2/econml-dean-verified.json')
          x=json.loads(p.read_text())
          assert x['status']=='verified'
          assert x['provenance']['dgp']=='zip_dgp_2026'
          assert x['provenance']['randomized_at']=='student'
          assert x['provenance']['train_students']==900
          assert x['provenance']['holdout_students']==300
          assert len(x['segments'])==4
          assert set(x['metrics'])=={'t_learner','dr_learner','causal_forest'}
          assert all(0<=m['cate_rmse_points']<50 for m in x['metrics'].values())
          print('DEAN_CANONICAL_ECONML_VALIDATED')
          PY
      - name: Commit provenance-backed artifact only on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add causal-wargame/src/v2/econml-dean-verified.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(v2): verified canonical Copa EconML benchmark [skip ci]'
            git push
          fi
