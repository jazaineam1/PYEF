name: causal-wargame-ci

on:
  push:
    branches: [main]
    paths:
      - 'causal-wargame/**'
      - '.github/workflows/causal-wargame-ci.yml'
  pull_request:
    paths:
      - 'causal-wargame/**'
      - '.github/workflows/causal-wargame-ci.yml'
  workflow_dispatch:

concurrency:
  group: causal-wargame-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: causal-wargame
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Unit tests and both builds
        run: npm run check
      - name: Validate live smoke syntax
        run: node --check scripts/learning_flow_interdependent_smoke.mjs
      - name: Verify private scenario was not committed
        run: test ! -f scenario-private.sql
      - name: Full learning-flow smoke — interdependent roles, reveals and checks
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CW_BASE_URL: https://nedsrnqwvxtelddmtvtv.supabase.co/functions/v1
        run: node scripts/learning_flow_interdependent_smoke.mjs
      - name: Specialist evidence round-trip smoke
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node scripts/role_evidence_smoke.mjs
