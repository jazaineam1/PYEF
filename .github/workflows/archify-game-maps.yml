name: Render DOS FUTUROS Archify maps

on:
  push:
    branches:
      - docs/archify-game-maps
    paths:
      - causal-wargame/docs/archify/*.json
      - .github/workflows/archify-game-maps.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PYEF
        uses: actions/checkout@v4
        with:
          ref: docs/archify-game-maps
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout Archify
        run: git clone --depth 1 https://github.com/tt-a1i/archify.git "$RUNNER_TEMP/archify"

      - name: Install Archify dependencies
        working-directory: ${{ runner.temp }}/archify/archify
        run: npm install --no-audit --no-fund

      - name: Archify doctor
        working-directory: ${{ runner.temp }}/archify/archify
        run: node bin/archify.mjs doctor

      - name: Validate technical architecture
        working-directory: ${{ runner.temp }}/archify/archify
        run: >-
          node bin/archify.mjs validate architecture
          "$GITHUB_WORKSPACE/causal-wargame/docs/archify/dos-futuros-architecture.json"
          --quality showcase --json

      - name: Validate game workflow
        working-directory: ${{ runner.temp }}/archify/archify
        run: >-
          node bin/archify.mjs validate workflow
          "$GITHUB_WORKSPACE/causal-wargame/docs/archify/dos-futuros-game-flow.json"
          --quality showcase --json

      - name: Deliver technical architecture
        working-directory: ${{ runner.temp }}/archify/archify
        run: >-
          node bin/archify.mjs deliver architecture
          "$GITHUB_WORKSPACE/causal-wargame/docs/archify/dos-futuros-architecture.json"
          "$GITHUB_WORKSPACE/causal-wargame/docs/archify/dos-futuros-architecture.html"
          --quality showcase --json

      - name: Deliver game workflow
        working-directory: ${{ runner.temp }}/archify/archify
        run: >-
          node bin/archify.mjs deliver workflow
          "$GITHUB_WORKSPACE/causal-wargame/docs/archify/dos-futuros-game-flow.json"
          "$GITHUB_WORKSPACE/causal-wargame/docs/archify/dos-futuros-game-flow.html"
          --quality showcase --json

      - name: Upload rendered Archify maps
        uses: actions/upload-artifact@v4
        with:
          name: dos-futuros-archify-maps
          path: |
            causal-wargame/docs/archify/dos-futuros-architecture.html
            causal-wargame/docs/archify/dos-futuros-game-flow.html
            causal-wargame/docs/archify/*.json

      - name: Commit rendered HTML to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add causal-wargame/docs/archify/*.html
          if git diff --cached --quiet; then
            echo "No rendered changes"
            exit 0
          fi
          git commit -m "docs: render Archify game maps [skip ci]"
          git push origin HEAD:docs/archify-game-maps
